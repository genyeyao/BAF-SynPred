[build-system]
requires = ["setuptools>=61,<69"]
build-backend = "setuptools.build_meta"

[project]
name = "bafsynpred"
version = "1.0.0"
description = "Cell-conditioned dual-view drug-combination synergy prediction"
readme = "README.md"
requires-python = ">=3.7,<3.11"
dependencies = [
  "numpy==1.21.6",
  "pandas==1.3.5",
  "scikit-learn==1.0.2",
  "tqdm==4.64.1",
]

[tool.setuptools.packages.find]
where = ["src"]

